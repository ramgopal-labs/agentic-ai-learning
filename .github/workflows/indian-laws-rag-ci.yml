name: indian-laws-rag CI

# Scoped to this project's folder: the repo holds other work, and none of it
# should trigger a 20-minute ML dependency install.
on:
  push:
    branches: [main, master]
    paths:
      - "indian-laws-rag/**"
      - ".github/workflows/indian-laws-rag-ci.yml"
  pull_request:
    paths:
      - "indian-laws-rag/**"
      - ".github/workflows/indian-laws-rag-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: indian-laws-rag

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indian-laws-rag/requirements.txt

      - name: Install dependencies
        # CPU-only torch: the default wheel pulls gigabytes of CUDA libraries
        # this project can never use, and the runner has no GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app scripts tests ui

      - name: Format check
        run: ruff format --check app scripts tests ui

      - name: Test
        # The suite fakes the LLM and the HTTP layer, so it needs no API key,
        # no running services and no model downloads.
        run: pytest -q

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: indian-laws-rag
          file: indian-laws-rag/Dockerfile.ui
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The API image bakes ~3GB of model weights, so it is built only on the
      # default branch rather than on every pull request.
      - name: Build API image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: indian-laws-rag
          file: indian-laws-rag/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
