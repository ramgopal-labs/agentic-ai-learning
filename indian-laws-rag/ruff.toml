line-length = 90
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[lint.per-file-ignores]
# Tests import fixtures and assert on shapes; these rules fight that style.
"tests/*" = ["E402"]
