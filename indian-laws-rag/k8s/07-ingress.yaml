# Assumes an nginx ingress controller and cert-manager. Adjust annotations and
# hosts for your cluster before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag
  namespace: indian-laws-rag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Model inference is slow; the default 60s would cut answers off.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - laws.example.com
      secretName: rag-tls
  rules:
    - host: laws.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
