apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: indian-laws-rag
data:
  QDRANT_URL: "http://qdrant:6333"
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  SERVICE_NAME: "indian-laws-rag"
  CONFIDENCE_THRESHOLD: "0.35"
  RERANK_TOP_N: "6"
  RATE_LIMIT_PER_MINUTE: "60"
  CORS_ORIGINS: "*"
---
# Placeholder values only. Create the real Secret out-of-band and never commit it:
#
#   kubectl -n indian-laws-rag create secret generic rag-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=API_KEY=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=DATABASE_URL=postgresql://laws:<password>@postgres:5432/laws \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: indian-laws-rag
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  API_KEY: "replace-me"
  POSTGRES_PASSWORD: "replace-me"
  DATABASE_URL: "postgresql://laws:replace-me@postgres:5432/laws"
  SERPER_API_KEY: ""
